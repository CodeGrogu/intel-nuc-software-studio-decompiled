name: Bug report
description: Report a tooling, documentation or backend defect.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include a minimal reproduction and whether this was offline or on hardware.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Repository version, Windows build and NUC model/BIOS family. Omit serial numbers and personal paths.
  - type: textarea
    id: validation
    attributes:
      label: Relevant validation
      description: Paste a small, redacted error excerpt. Do not upload raw dumps, credentials or vendor installers.
