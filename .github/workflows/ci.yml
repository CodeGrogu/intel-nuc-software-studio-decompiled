name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Windows desktop
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: desktop/global.json
      - name: Restore locked dependencies
        run: dotnet restore NucControl.slnx --locked-mode
      - name: Test client and control behavior without hardware
        run: dotnet test --project NucControl.Tests/NucControl.Tests.csproj --no-restore
      - name: Publish portable frontend
        run: ./Publish.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NUC-Control-win-x64
          path: |
            desktop/artifacts/*.zip
            desktop/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Test publication guards
        run: python -m unittest discover -s tools/tests -v
      - name: Lint workflows with checksum-pinned Actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Check metadata, workflows, and publication inputs
        run: python tools/check_repository.py
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        run: python tools/check_repository.py --pr-title

  powershell:
    name: PowerShell syntax
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse maintained scripts without executing them
        shell: pwsh
        run: ./tools/check_powershell.ps1
      - name: Test service-location ACL guard without touching the service
        shell: pwsh
        run: ./tools/tests/ServiceSecurity.Tests.ps1

  backend:
    name: Windows backend
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test contracts, operations, pipe security, and pure resume preflight
        run: cargo test --locked --workspace --lib --tests
      - name: Compile service without installation or execution
        run: cargo build --locked --release -p nuc11ph-service
