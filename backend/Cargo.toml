[workspace]
resolver = "2"
members = [
    "crates/nuc11ph-protocol",
    "crates/nuc11ph-hw",
    "crates/nuc11ph-telemetry",
    "crates/nuc11ph-service",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["NUC11PHi7 Windows 11 Studio Contributors"]
license = "MIT"
description = "Hardware Control, Telemetry, and Windows 11 Service Suite for Intel NUC11PHi7 (Phantom Canyon)"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
nvml-wrapper = "0.10"
windows-service = "0.8"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
